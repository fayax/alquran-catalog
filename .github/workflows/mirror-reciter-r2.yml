name: Mirror a reciter to R2

# Copies a reciter's ayah-by-ayah recitation into the Cloudflare R2 bucket
# (audio/<reciter>/SSSAAA.mp3 and manifest-SSS.json), because QUL asks
# apps not to stream from its CDN. Safe to re-run: complete surahs are
# skipped.
on:
  workflow_dispatch:
    inputs:
      reciter:
        description: Reciter id used in paths and the app
        default: afasy
        required: true
      source:
        description: Source URL template ({surah3}{ayah3})
        default: https://audio-cdn.tarteel.ai/quran/alafasy/{surah3}{ayah3}.mp3
        required: true
      public_url:
        description: Public address of the bucket
        default: https://cdn-alquran.fayax.net
        required: true

permissions:
  contents: read

concurrency:
  group: mirror-r2-${{ inputs.reciter }}
  cancel-in-progress: false

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}

jobs:
  mirror:
    name: Surahs ${{ matrix.range[0] }}-${{ matrix.range[1] }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        range: [[1, 2], [3, 6], [7, 12], [13, 25], [26, 50], [51, 114]]
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!v}" ] || { echo "::error::Missing repository secret $v"; exit 1; }
          done
      - name: Mirror
        run: >
          tools/mirror_reciter_r2.sh "${{ inputs.reciter }}" "${{ inputs.source }}"
          ${{ matrix.range[0] }} ${{ matrix.range[1] }}

  check:
    name: Check all 114 surahs
    needs: mirror
    runs-on: ubuntu-latest
    steps:
      - run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          missing=0
          for s in $(seq 1 114); do
            S=$(printf '%03d' "$s")
            aws --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" s3api head-object \
              --bucket "$R2_BUCKET" --key "audio/${{ inputs.reciter }}/manifest-$S.json" >/dev/null 2>&1 \
              || { echo "missing $S"; missing=1; }
          done
          exit $missing
      - name: Public URL serves the files
        run: |
          base="${{ inputs.public_url }}/audio/${{ inputs.reciter }}"
          curl -fsS -o /dev/null -D - "$base/001001.mp3" | tee headers.txt
          grep -qi '^content-type: audio/mpeg' headers.txt
          curl -fsS "$base/manifest-001.json" | head -c 200; echo
